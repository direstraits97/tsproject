<h2>Kurser</h2>
<form>
  <label for="subject" class="textandiconeven"><img src="/ikoner/subject.svg" alt="" />Ämne:</label>
  <select id="subject"></select>
  <label for="search" class="textandiconeven"
    ><img src="/ikoner/search.svg" alt="" />Sök kurs:</label
  >
  <input
    type="search"
    id="search"
    name="search"
    placeholder="Namn på kurs eller kurskod"
    [(ngModel)]="courseSearch"
    (input)="filterBySearch()"
  />
</form>
<p class="numberofresults">Visar ?-? av ? kurser</p>
<table>
  <thead>
    <tr>
      <th class="sortable" (click)="sortByCode()">Kurskod</th>
      <th class="sortable" (click)="sortByName()">Kursnamn</th>
      <th class="sortable" (click)="sortByPoints()">Poäng</th>
      <th class="sortable" (click)="sortBySubject()">Ämne</th>
      <th>Kursplan</th>
      <th>Lägg till</th>
    </tr>
  </thead>
  <tbody>
    @for (course of manipulatedCourses(); track course.courseCode) {
      <tr>
        <td>{{ course.courseCode }}</td>
        <td>{{ course.courseName }}</td>
        <td>{{ course.points }}</td>
        <td>{{ course.subject }}</td>
        <td><a href="{{ course.syllabus }}">Kursplan</a></td>
        <td>
          <button class="textandiconeven">Lägg till<img src="/ikoner/add.svg" alt="" /></button>
        </td>
      </tr>
    }
  </tbody>
</table>
<p class="numberofresults">Visar ?-? av ? kurser</p>
<div id="paginering">
  <button class="pagineringbutton textandiconeven"><img src="/ikoner/back.svg" alt="" /></button>
  <button class="pagineringbutton textandiconeven">1</button>
  <button class="pagineringbutton textandiconeven">
    <img src="/ikoner/forward.svg" alt="" />
  </button>
</div>
